<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/src/assets/manyorder-logo.png" />

    <title>ManyOrder</title>
    <meta name="description" content="ManyOrder is online ordering for small shops. Create a storefront, share a link, and take orders." />
    <link rel="canonical" href="https://manyorder.app/" />

    <!-- Open Graph (Facebook, WhatsApp, Telegram, etc.). The storefront sets a
         per-shop <title> at runtime, but link unfurlers do not run JavaScript, so
         per-shop crawler previews are a separate backlog item. -->
    <meta property="og:site_name" content="ManyOrder" />
    <meta property="og:title" content="ManyOrder" />
    <meta property="og:description" content="Online ordering for small shops. Create a storefront, share a link, and take orders." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://manyorder.app/" />
    <meta property="og:image" content="https://manyorder.app/manyorder-logo.png" />
    <meta property="og:image:alt" content="ManyOrder" />

    <!-- Twitter card. "summary" pairs with a small square logo. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ManyOrder" />
    <meta name="twitter:description" content="Online ordering for small shops. Create a storefront, share a link, and take orders." />
    <meta name="twitter:image" content="https://manyorder.app/manyorder-logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
