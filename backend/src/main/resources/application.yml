spring:
  application:
    name: manyorder-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  google:
    # Leave unset to disable Google sign-in (the button hides itself in the SPA).
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  resend:
    # Leave unset to disable outbound email (the reset flow no-ops the send).
    api-key: ${RESEND_API_KEY:}
  mail:
    from: ${MAIL_FROM:onboarding@resend.dev}
  frontend:
    # Base URL the emailed reset link points back to.
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
